[workspace]
resolver = "3"
members = ["crates/pio-core", "crates/pio-host", "crates/pio-cli", "crates/pio-protocol", "crates/pio-codex", "crates/pio-claude"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
