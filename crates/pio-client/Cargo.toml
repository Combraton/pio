[package]
name = "pio-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A typed client for PIO's public Protocol over stream/1, and the client-side folds the terminal screen draws from"

# Public wire only. This crate must never depend on a PIO service crate
# (pio-core, pio-protocol, pio-host or an adapter): the screen reads and
# writes only through the public API the command line uses (M4 rule 1).
# `tests/dependencies.rs` fails if it ever does.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
libc.workspace = true
base64 = "0.22"
