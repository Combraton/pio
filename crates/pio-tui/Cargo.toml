[package]
name = "pio-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "PIO's terminal screen: the board and the run view, drawn from the public client"

# M4 rule 1: the screen reads and writes only through the public API the
# command line uses. pio-client is the one workspace crate this may depend
# on; everything else is a generic registry crate. `tests/boundary.rs` holds
# that line structurally: the dependency graph, rustc's own list of the
# source files compiled in, and no symlink inside this directory.
[dependencies]
pio-client = { path = "../pio-client" }
anyhow.workspace = true
serde_json.workspace = true
libc.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
