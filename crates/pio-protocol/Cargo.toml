[package]
name = "pio-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[features]
# D10: Codex's own dated, test-only model exception and rehearsal-only
# FEATURES_OFF/PLUGINS_OFF tokens (stream.rs), plus a pass-through so
# disabling this feature on pio-protocol also disables it on the two crates
# below, whose admission checks carry the same kind of exception. On by
# default; the release/packaged build turns it off with
# `--no-default-features`.
default = ["test-exceptions"]
test-exceptions = ["pio-claude/test-exceptions", "pio-opencode/test-exceptions"]
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
uuid.workspace = true
pio-core = { path = "../pio-core" }
pio-host = { path = "../pio-host" }
pio-codex = { path = "../pio-codex" }
pio-claude = { path = "../pio-claude", default-features = false }
pio-opencode = { path = "../pio-opencode", default-features = false }
jsonschema = { version = "0.56.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
chrono = "0.4"
base64 = "0.22"
libc.workspace = true
[dev-dependencies]
tempfile = "3"
