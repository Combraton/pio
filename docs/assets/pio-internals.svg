<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">PIO: authorize once, observe, reconcile</title><desc id="desc">Proposed internals. Harnesses keep their agent loops; Comreton keeps workflow control.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#627987"/></marker></defs><rect width="1100" height="830" fill="#f6f7f3"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="29" fill="#233d4b" font-weight="700">PIO: authorize once, observe, reconcile</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">Proposed internals. Harnesses keep their agent loops; Comreton keeps workflow control.</text><path d="M195 198V242" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M350 299H395" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M705 299H750" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 356V410" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 469H705" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M905 528V553H195V528" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><path d="M550 528V581" fill="none" stroke="#627987" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="110" width="1020" height="88" rx="10" fill="#e1eee9" stroke="#aabdbf"/><text x="58" y="140" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">Comreton or standalone caller</text><text x="58" y="167" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Submits authorized work with revision, permissions, budget and retry policy.</text><rect x="40" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="58" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">1. Durable admission</text><text x="58" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Command + grant + capacity</text><text x="58" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Workspace and budget reserved</text><rect x="395" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="413" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">2. Fenced dispatch right</text><text x="413" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Execution / invocation identity</text><text x="413" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Intent before external boundary</text><rect x="750" y="242" width="310" height="114" rx="10" fill="#e8eff5" stroke="#aabdbf"/><text x="768" y="272" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">3. Supervised harness</text><text x="768" y="299" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Host + native identity + output</text><text x="768" y="322" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Delivery proof or ambiguity</text><rect x="750" y="410" width="310" height="118" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="768" y="440" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">4. Persist result receipt</text><text x="768" y="467" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Immutable payload + outbox</text><text x="768" y="490" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Same identity, same content</text><rect x="395" y="410" width="310" height="118" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="413" y="440" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">5. Publish domain facts</text><text x="413" y="467" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">PIO → CBR / controller</text><text x="413" y="490" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Verification before adoption</text><rect x="40" y="410" width="310" height="118" rx="10" fill="#f4edda" stroke="#aabdbf"/><text x="58" y="440" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">6. Reconcile observations</text><text x="58" y="467" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Process / workspace / effects</text><text x="58" y="490" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Usage and liability coverage</text><rect x="40" y="581" width="1020" height="112" rx="10" fill="#eee9f1" stroke="#aabdbf"/><text x="58" y="611" font-family="Arial,sans-serif" font-size="19" fill="#233d4b" font-weight="700">Recovery reads these records before another effect is authorized</text><text x="58" y="638" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Lost acknowledgment → inspect the original execution. Expired lease → investigate the surviving writer.</text><text x="58" y="661" font-family="Arial,sans-serif" font-size="16" fill="#233d4b">Timeout → preserve unresolved liability. Late old result → preserve it under its original attempt.</text><text x="40" y="766" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">A receipt can publish while reconciliation remains pending. Project adoption is a separate decision.</text><text x="40" y="792" font-family="Arial,sans-serif" font-size="17" fill="#233d4b">A database commit cannot make an opaque external effect exactly once. Recovery must preserve uncertainty.</text></svg>